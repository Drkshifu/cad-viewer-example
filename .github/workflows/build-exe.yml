name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile
          pnpm add -D -w electron electron-builder

      - name: Build Web App
        run: pnpm run build

      - name: Setup Electron entry and package config
        run: |
          node -e "
          const fs = require('fs');
          // 写入带控制台的入口文件
          const mainContent = \`
          const { app, BrowserWindow } = require('electron');
          const path = require('path');

          function createWindow() {
            const win = new BrowserWindow({
              width: 1400,
              height: 900,
              title: 'CADViewer',
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true,
                webSecurity: false
              }
            });

            win.loadFile(path.join(__dirname, 'dist/index.html'));
            // 自动开启开发者工具，排查是否有缺文件或报错
            win.webContents.openDevTools();
          }

          app.whenReady().then(createWindow);
          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          \`;
          fs.writeFileSync('main.cjs', mainContent);

          // 更新 package.json，显式声明打包文件与输出目录
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.main = 'main.cjs';
          pkg.productName = 'CADViewer';
          pkg.build = {
            appId: 'com.mlightcad.viewer',
            directories: {
              output: 'release'
            },
            files: [
              'dist/**/*',
              'main.cjs'
            ],
            win: {
              target: 'portable'
            }
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Build Windows EXE
        run: npx electron-builder --win portable --x64 --publish never

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CAD-Viewer-Windows-EXE
          path: release/*.exe
