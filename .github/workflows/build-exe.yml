name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile
          pnpm add -D -w electron electron-builder

      - name: Build Web App
        run: pnpm run build

      - name: Prepare package.json and entry for Electron
        run: |
          node -e "const fs=require('fs'); if(fs.existsSync('main.js')) fs.renameSync('main.js', 'main.cjs'); const pkg=JSON.parse(fs.readFileSync('./package.json','utf8')); pkg.main='main.cjs'; pkg.productName='CADViewer'; fs.writeFileSync('./package.json', JSON.stringify(pkg, null, 2))"

      - name: Build Windows EXE
        run: npx electron-builder --win portable --x64 --publish never

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CAD-Viewer-Windows-EXE
          path: dist/*.exe
